<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Mihir Patel" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1726" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
    <script>
      // Apply a saved theme before first paint so the page never flashes the wrong colours.
      try {
        var theme = localStorage.getItem("mihir-portfolio-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <title>Page not found · Mihir Patel</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/src/styles/paper.css" />
  </head>
  <body>
    <main class="page not-found">
      <h1 class="name">Page not found</h1>
      <p class="intro">There is nothing at this address. Everything on the site is on <a href="/">the front page</a>.</p>
    </main>
  </body>
</html>
