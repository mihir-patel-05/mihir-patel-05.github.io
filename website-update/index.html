    <meta name="theme-color" content="#0d1726" media="(prefers-color-scheme: dark)" />

    <script>
      // Apply a saved theme before first paint so the page never flashes the wrong colours.
      try {
        var theme = localStorage.getItem("mihir-portfolio-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
